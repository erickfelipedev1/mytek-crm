<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { background: #ffffff; color: #111111; }
      @media (prefers-color-scheme: dark) { body { background: #0b0b0c; color: #f3f3f3; } }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; padding: 24px; text-align: center; }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 0; max-width: 28rem; opacity: 0.7; line-height: 1.5; }
      button { margin-top: 8px; padding: 10px 20px; border-radius: 8px; border: 1px solid currentColor;
        background: transparent; color: inherit; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>Não deu pra abrir esta tela. Confira sua internet e tente de novo.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
